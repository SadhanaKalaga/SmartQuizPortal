<div class="container">
  <h2>{{ isEditMode ? 'Edit Quiz' : 'Create Quiz' }}</h2>
  <form (ngSubmit)="onSubmit()">
    <div>
      <label>Title:</label>
      <input type="text" [(ngModel)]="title" name="title" required>
    </div>
    <div>
      <label>Description:</label>
      <textarea [(ngModel)]="description" name="description"></textarea>
    </div>
    <div>
      <label>Time Limit (minutes):</label>
      <input type="number" [(ngModel)]="timeLimit" name="timeLimit" min="1" required>
    </div>

    <h3>Schedule</h3>
    <div>
      <label>Start Time:</label>
      <input type="datetime-local" [(ngModel)]="startTime" name="startTime" required>
    </div>
    <div>
      <label>End Time:</label>
      <input type="datetime-local" [(ngModel)]="endTime" name="endTime" required>
    </div>
    <div>
      <label>Maximum Attempts:</label>
      <input type="number" [(ngModel)]="maxAttempts" name="maxAttempts" min="1" required>
    </div>

    <h3>Questions</h3>
    <div *ngFor="let q of questions; let i = index" class="question-block">
      <h4>Question {{ i + 1 }}</h4>
      <div>
        <label>Question:</label>
        <input type="text" [(ngModel)]="q.question" [name]="'question' + i" required>
      </div>
      <div *ngFor="let opt of q.options; let j = index">
        <label>Option {{ j + 1 }}:</label>
        <input type="text" [(ngModel)]="q.options[j]" [name]="'option' + i + j" required>
      </div>
      <div>
        <label>Correct Answer:</label>
        <select [(ngModel)]="q.correctAnswer" [name]="'correct' + i">
          <option [value]="0">Option 1</option>
          <option [value]="1">Option 2</option>
          <option [value]="2">Option 3</option>
          <option [value]="3">Option 4</option>
        </select>
      </div>
      <div>
        <label>Points:</label>
        <input type="number" [(ngModel)]="q.points" [name]="'points' + i" min="1" required>
      </div>
      <button type="button" (click)="removeQuestion(i)" *ngIf="questions.length > 1">Remove</button>
    </div>

    <button type="button" (click)="addQuestion()">Add Question</button>
    <p *ngIf="error" class="error">{{ error }}</p>
    <button type="submit">{{ isEditMode ? 'Update Quiz' : 'Create Quiz' }}</button>
  </form>
</div>
